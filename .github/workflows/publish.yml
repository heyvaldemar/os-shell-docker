name: Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild: every line gets the week's Debian security updates. The
    # pinned base digests move only by pull request.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: heyvaldemar/os-shell

jobs:
  lint:
    name: Lint Dockerfile and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh

  test:
    name: Test Debian ${{ matrix.line.major }} before it is published
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        line:
          - { major: "12", latest: false }
          - { major: "13", latest: true }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image for this runner
        env:
          MAJOR: ${{ matrix.line.major }}
        run: docker build --build-arg "DEBIAN_MAJOR=${MAJOR}" -t "os-shell:${MAJOR}" .

      # The same user, command, HOME, PATH and build SHELL as the last
      # versioned bitnami/os-shell, every executable on its PATH or a reason,
      # and the calls init containers make, run on both images.
      - name: A drop-in for bitnami/os-shell
        env:
          MAJOR: ${{ matrix.line.major }}
        run: ./tests/drop-in-test.sh "os-shell:${MAJOR}"

      # No critical or high finding that a rebuild can remove.
      - name: No fixable critical or high finding
        env:
          MAJOR: ${{ matrix.line.major }}
        run: ./scripts/cve-gate.sh "os-shell:${MAJOR}"

      # Nothing an init container used yesterday is gone today.
      - name: The contract with what is already published
        env:
          MAJOR: ${{ matrix.line.major }}
        run: ./scripts/contract-test.sh "os-shell:${MAJOR}" "${IMAGE_NAME}:${MAJOR}" "$MAJOR"

      # Bitnami's own charts, on a fresh kind cluster, with this image as their
      # os-shell: PostgreSQL's volume permissions and Redis's sysctl.
      - name: Bitnami's charts run their init containers on it
        env:
          MAJOR: ${{ matrix.line.major }}
        run: ./tests/charts-e2e.sh "os-shell:${MAJOR}"

      - name: The tests, shown each violation they exist for
        if: matrix.line.major == '12'
        run: python3 tests/plant-violations.py -- bash -c "docker build -q --build-arg DEBIAN_MAJOR=12 -t os-shell:plant . >/dev/null && ./tests/drop-in-test.sh os-shell:plant >/dev/null 2>&1 && ./scripts/cve-gate.sh os-shell:plant >/dev/null 2>&1"

  build:
    name: Build and publish Debian ${{ matrix.line.major }}
    runs-on: ubuntu-latest
    # Nothing is published that the test has not passed.
    needs: [lint, test]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        line:
          - { major: "12", latest: false }
          - { major: "13", latest: true }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Hub credentials are set
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::this repository has no DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret; add both (a Docker Hub access token with write access to heyvaldemar/os-shell) and run the workflow again"
            exit 1
          fi

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "vcs_ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Debian line (12, 13), and latest on the newest line. Each moves
      # with the weekly rebuild, so a pinned tag still receives security
      # updates; pin a digest for an image that never changes.
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.line.latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ matrix.line.major }}
          labels: |
            org.opencontainers.image.title=os-shell
            org.opencontainers.image.description=A Debian ${{ matrix.line.major }} shell for init containers, rebuilt weekly, signed; a drop-in for bitnami/os-shell.
            org.opencontainers.image.vendor=heyvaldemar
            org.opencontainers.image.licenses=MIT
            io.heyvaldemar.os-shell.debian=${{ matrix.line.major }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEBIAN_MAJOR=${{ matrix.line.major }}
            VCS_REF=${{ steps.meta-build.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta-build.outputs.build_date }}
          # No cache from earlier runs: the weekly rebuild exists to take the
          # week's Debian updates, which a cached apt layer would skip.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=os-shell-${{ matrix.line.major }}
          cache-to: type=gha,mode=max,scope=os-shell-${{ matrix.line.major }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # Cosign v2: tag-based .sig storage, which works on Docker Hub today
        # (heyvaldemar/aws-kubectl-docker, hotfix #20).
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.1"

      - name: Sign image with cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${TAGS}" ] || [ -z "${DIGEST}" ]; then
            echo "ERROR: TAGS or DIGEST is empty" >&2
            exit 1
          fi
          echo "${TAGS}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing: ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done

  scan-trivy:
    name: Scan published Debian ${{ matrix.major }} with Trivy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        major: ["12", "13"]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The digest ${{ matrix.major }} names now
        id: digest
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${MAJOR}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::could not resolve ${IMAGE_NAME}:${MAJOR}"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Findings do not fail this job; a scan that cannot finish does.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-debian-${{ matrix.major }}

  measure:
    name: CVE counts against the images it replaces
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Count
        env:
          PLATFORM: linux/amd64
        run: ./scripts/measure-cves.sh "${IMAGE_NAME}:12" "${IMAGE_NAME}:13" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the counts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cves
          path: reports/
          retention-days: 90

  # The ruleset requires checks by names that stay put. This one stands for
  # every line, and fails if any line failed or was skipped.
  published:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every line was tested and built
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, test, build: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a job this one stands for ended '$r'"; exit 1; }
          done

  dockerhub-description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "A Debian shell for init containers, rebuilt weekly and signed. A drop-in for bitnami/os-shell."
          readme-filepath: ./README.md
