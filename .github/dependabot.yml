# Keeps the pinned GitHub Actions and base images current. Every workflow here
# pins its actions to a commit SHA, and the Dockerfile pins its three images
# (golang, debian:bookworm-slim, debian:trixie-slim) by digest; a pin never
# moves on its own, so Dependabot opens the pull request, the real build gates
# it, and the auto-merge workflow merges it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # DAILY, AT 03:00 UTC: before the freshness check at 05:30, so a Debian
  # repush is usually carried before the alarm can read it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "build"
